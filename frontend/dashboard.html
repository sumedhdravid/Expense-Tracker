<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - Expense Tracker</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>

</head>

<body>

    <div class="dashboard-container">

        <div class="dashboard-header">

            <div>
                <h1>Expense Tracker</h1>

                <p id="welcomeMessage">
                    Welcome back!
                </p>
            </div>

            <button
                id="dashboardLogout"
                class="logout-button"
            >
                Logout
            </button>

        </div>


        <div class="dashboard-actions">

            <a
                href="add-expense.html"
                class="add-button"
            >
                + Add Expense
            </a>

            <a
                href="expenses.html"
                class="view-button"
            >
                View Expenses
            </a>

        </div>


        <div class="summary-cards">

            <div class="summary-card">

                <h3>Total Expenses</h3>

                <p id="totalExpenses">
                    0
                </p>

            </div>


            <div class="summary-card">

                <h3>Total Amount</h3>

                <p id="totalAmount">
                    ₹0.00
                </p>

            </div>

        </div>


        <div class="chart-container">

            <h2>Expense Distribution</h2>

            <div class="chart-wrapper">

                <canvas
                    id="expenseChart"
                ></canvas>

            </div>

            <p
                id="chartMessage"
                class="chart-message"
            ></p>

        </div>

    </div>


    <script src="js/dashboard.js"></script>

</body>

</html>
