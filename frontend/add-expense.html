<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Expense - Expense Tracker</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Add Expense</h1>

            <p class="subtitle">
                Record a new expense
            </p>


            <form id="expenseForm">


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        step="0.01"
                        min="0.01"
                        placeholder="Enter amount"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="comments">
                        Comments
                    </label>

                    <textarea
                        id="comments"
                        placeholder="Optional comments"
                        rows="4"
                    ></textarea>

                </div>


                <button type="submit">
                    Add Expense
                </button>

            </form>


            <p id="expenseMessage"></p>


            <p class="switch-page">

                <a href="dashboard.html">
                    Back to Dashboard
                </a>

            </p>

        </div>

    </div>


    <script src="js/expenses.js"></script>

</body>

</html>
