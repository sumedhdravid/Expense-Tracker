<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Expenses - Expense Tracker</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="page-container">

        <div class="page-header">

            <div>
                <h1>My Expenses</h1>
                <p>Track and manage your expenses</p>
            </div>

            <div>

                <a
                    href="add-expense.html"
                    class="add-button"
                >
                    + Add Expense
                </a>

                <button
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>

        </div>


        <div class="table-container">

            <table>

                <thead>
    <tr>
        <th>Category</th>
        <th>Amount</th>
        <th>Created At</th>
        <th>Updated At</th>
        <th>Comments</th>
        <th>Actions</th>
    </tr>
</thead>

                <tbody id="expenseTableBody">

                    <tr>
                        <td colspan="5">
                            Loading expenses...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script src="js/expenses.js"></script>

</body>

</html>
